[project]
name = "glowbox"
version = "0.1.0"
description = "Neural networks get the controls and sensors of an NV-diamond quantum system (simulation first)."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "torch>=2.7",
    "qutip>=5.0",
    "pyyaml>=6.0",
    "pyarrow>=17.0",
    "pandas>=2.2",
    "matplotlib>=3.9",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-pyyaml",
    "pandas-stubs",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["glowbox"]

# PyTorch: CUDA 12.8 wheels on Windows and Linux (the first CUDA line with Blackwell sm_120 kernels).
# They also run on machines without a GPU, so one universal lock serves every box; macOS gets PyPI wheels.
[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF", "NPY", "PT"]
ignore = [
    "N803", # physics names such as B, T1, T2 as arguments
    "N806", # and as locals
    "N815", # and as dataclass fields
    "RUF001", "RUF002", "RUF003", # Greek letters and the multiplication sign in docs
    "PT011", "PT018",             # broad ValueError checks and compound asserts are fine in tests
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -m 'not slow'"
markers = [
    "gpu: needs a CUDA device (skipped when none is present)",
    "slow: minutes on a CPU; deselected by default, run with -m slow",
]

[tool.mypy]
python_version = "3.12"
packages = ["glowbox"]
warn_unused_ignores = true
disallow_untyped_defs = true
ignore_missing_imports = true
