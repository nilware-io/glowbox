# Milestone 4, Task 4: compress-and-reconstruct. A learned pulse encoder writes 4x4 image patches into MW blocks,
# the NV ensemble's gated readouts are the bottleneck, a decoder reconstructs the patch; trained end to end through
# the differentiable surrogate. Baseline: the same encoder parametrisation fixed at random (reservoir). Quantum
# test: every MW frequency + 400 MHz, trained and evaluated the same way.
# Run: uv run python -m glowbox.experiments.m4_autoencoder  (add --quick for a few-minute smoke run)
name: m4-autoencoder
seed: 20261128
seeds: [0, 1, 2, 3, 4]        # each seed: its own device (nuisance draw), data, initialisation and noise
detuned_offset_hz: 4.0e+8

device:
  bias_field_t: [1.2e-3, 0.7e-3, 2.5e-3]   # known static field: eight distinct lines (as milestones 1 and 3)
  prior:                      # nuisance ranges per seed (glowbox.learn.field_data.FieldPrior, assumptions)
    t2_star_s: [0.5e-6, 2.0e-6]
    rabi_full_scale_hz: [8.0e+6, 12.0e+6]
    optical_beta_full_scale: [0.07, 0.13]
    collection_efficiency: [2.0e-3, 4.0e-3]
    background_cps: [5.0e+3, 2.0e+4]
    e_hz: [0.0, 3.0e+5]
  n_detuning: 8               # T2* quadrature (quantile rule) for training and evaluation; checked at 32 below
system: {init_ns: 1500, settle_ns: 1000}

layout:                       # glowbox.learn.encoder.Layout; n_blocks = the number of readouts K (grid below)
  n_segments: 4               # MW segments per block, tied to device lines (k * 4 + j) mod 8
  slot_ns: 100
  min_ns: 0.0
  max_ns: 100.0
  amp_lo: 0.0
  amp_hi: 1.0
  span_hz: 4.0e+6
  readout_ns: 1000            # readout laser per block; the first gate_ns are counted, the rest re-polarises
  gate_ns: 300
  gap_ns: 0

data: {size: 4, sharpness: 3.0, offset_max: 0.6, n_train: 8192, n_val: 512, n_test: 2048}

encoder:
  hidden: [64, 64]
  out_scale: 1.0
  init_amplitude: 0.5         # starting protocol: a = 0.5, 50 ns (~0.4 pi at the nominal full scale)
  init_duration_ns: 50.0
  random_gain: 1.5            # the fixed random baseline (as the milestone-3 reservoir encoder)
decoder: {hidden: [128, 128]}

train:                        # phase 1: encoder + decoder through the surrogate
  steps: 1000
  batch: 128
  lr_encoder: 3.0e-3
  lr_decoder: 1.0e-3
  shots: [1.0e+3, 1.0e+5]
  val_every: 100
bank_decoder:                 # phase 2 (and every baseline): fresh decoder on a bank, Poisson noise every step
  steps: 3000
  batch: 256
  lr: 1.0e-3
ideal: {steps: 4000, batch: 256, lr: 1.0e-3}

grid:
  blocks: [1, 2, 4]
  shots: [1000, 10000, 100000]
headline: {blocks: 2, shots: 10000}

timing:                       # resonant, headline K, every seed, learned and random encoders
  duration_shifts_ns: [-30, -20, -10, 0, 10, 20, 30]
  retrain_shifts_ns: [-20, 20]

reference:                    # QuTiP check: seed 0 resonant, headline K
  n_patterns: 16
  workers: 16
quadrature_check: {n_detuning: 32}

quick:
  device: {n_detuning: 4}
  data: {n_train: 512, n_val: 128, n_test: 256}
  encoder: {hidden: [32]}
  decoder: {hidden: [32]}
  train: {steps: 20, batch: 32, val_every: 10}
  bank_decoder: {steps: 200, batch: 64}
  ideal: {steps: 300}
  grid: {blocks: [1, 2]}
  timing: {duration_shifts_ns: [-20, 0, 20], retrain_shifts_ns: [20]}
  reference: {n_patterns: 2, workers: 2}
  quadrature_check: {n_detuning: 8}
